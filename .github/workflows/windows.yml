name: Windows
on:
  push:
    branches: [main, feat/windows-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-windows.txt
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q dictate windows
